<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grove — Coming Soon</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #f7f5ff;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at center, #24104b 0%, #0b0620 48%, #050019 100%);
}

main {
  position: relative;
  text-align: center;
  padding: 24px;
}

.logo {
  font-size: clamp(76px, 18vw, 150px);
  color: #a855f7;
  text-shadow: 0 0 25px #851eff80, 0 0 80px #353bff55;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: clamp(38px, 9vw, 64px);
  letter-spacing: 12px;
  text-indent: 12px;
  font-weight: 500;
}

p {
  margin-top: 22px;
  color: #c9b9ed;
  font-size: 13px;
  letter-spacing: 6px;
  text-indent: 6px;
  text-transform: uppercase;
}

.line {
  width: 90px;
  height: 2px;
  margin: 26px auto 0;
  background: linear-gradient(90deg, #851eff, #eb36ed, #05c9f4);
}
</style>
</head>
<body>
  <main>
    <div class="logo">✳</div>
    <h1>GROVE</h1>
    <div class="line"></div>
    <p>Coming Soon</p>
  </main>
</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f0d">
  <title>Grove</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f0d;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo-box {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0b0f0d;
      border: 1px solid #232b27;
      border-radius: 14px;
    }

    .grove-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .logo-box {
        width: 120px;
        height: 120px;
      }
    }
  </style></head><body>
  <main class="logo-box">
    <img
      class="grove-logo"
      src="grove-logo.png"
      alt="Grove"
    >
  </main>
</body>
</html>

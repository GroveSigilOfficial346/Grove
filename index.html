<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050019">
  <title>Grove</title>
  <meta name="description" content="Welcome to Grove.">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #050019;
      font-family: Arial, sans-serif;
    }

    .logo-box {
      width: min(100%, 380px);
      overflow: hidden;
      border: 1px solid rgba(133, 30, 255, 0.35);
      border-radius: 16px;
      background: #08051d;
      box-shadow:
        0 0 30px rgba(133, 30, 255, 0.15),
        0 0 60px rgba(53, 59, 255, 0.08);
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .logo-box {
        width: min(100%, 320px);
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="logo-box">
    <img
      src="file_000000009b2481fd95ab7bdc0b69b32f.png"
      alt="Grove logo"
    >
  </main>
</body>
</html>

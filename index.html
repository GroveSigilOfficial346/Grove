
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <title>Grove</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #050019;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo-box {
      width: min(100%, 380px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #39215e;
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 25% 48%, #35105b 0%, transparent 48%),
        radial-gradient(ellipse at 78% 45%, #101d66 0%, transparent 48%),
        #08051d;
      box-shadow: 0 0 42px #851eff24;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 480px) {
      .logo-box { width: min(100%, 320px); }
    }
  </style>
</head>
<body>
  <main class="logo-box" aria-label="Grove">
    <svg viewBox="0 0 380 380"
         xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="title">
      <title id="title">Grove — emblem and wordmark</title>
      <defs>
        <linearGradient id="emblem" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#eb36ed"/>
          <stop offset="48%" stop-color="#851eff"/>
          <stop offset="100%" stop-color="#05c9f4"/>
        </linearGradient>
        <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c17aff"/>
          <stop offset="52%" stop-color="#f7f5ff"/>
          <stop offset="100%" stop-color="#63eaff"/>
        </linearGradient>
        <radialGradient id="halo">
          <stop offset="0%" stop-color="#851eff" stop-opacity=".3"/>
          <stop offset="100%" stop-color="#050019" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <ellipse cx="190" cy="145" rx="130" ry="115" fill="url(#halo)"/>

      <circle cx="190" cy="139" r="77"
              fill="none" stroke="url(#emblem)"
              stroke-width="1.5" opacity=".65"/>

      <circle cx="190" cy="139" r="64"
              fill="none" stroke="#7b64ff"
              stroke-width=".8" opacity=".45"/>

      <g fill="none" stroke="url(#emblem)"
         stroke-width="4" stroke-linecap="round"
         stroke-linejoin="round" filter="url(#glow)">
        <path d="M190 183 V105"/>
        <path d="M190 151 C157 149 144 127 145 105 C169 107 187 124 190 151Z"/>
        <path d="M190 132 C211 130 231 111 232 89 C208 92 193 108 190 132Z"/>
        <path d="M190 170 C215 168 234 150 235 132 C212 134 196 148 190 170Z"/>
        <path d="M190 183 C169 180 153 166 151 149"/>
        <path d="M163 190 H217"/>
      </g>

      <path d="M25 222 C75 193 107 216 142 226 S214 237 258 215 S328 197 355 219"
            fill="none" stroke="#a855f7" stroke-width="1.5" opacity=".65"/>
      <path d="M25 230 C78 209 111 232 151 239 S227 244 267 226 S327 215 355 230"
            fill="none" stroke="#05c9f4" stroke-width="1" opacity=".55"/>

      <text x="190" y="285" text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="57" font-weight="300"
            letter-spacing="2" fill="url(#word)">grove</text>

      <path d="M115 305 H265"
            stroke="url(#emblem)" stroke-width="1.5" opacity=".8"/>
      <circle cx="190" cy="305" r="3" fill="#f7f5ff"/>
    </svg>
  </main>
</body>
</html>
